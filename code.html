<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ziad. - Link in Bio</title>
    <script
      src="https://kit.fontawesome.com/030973d822.js"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap");
      body {
        font-family: "JetBrains Mono", sans-serif;
      }
    </style>
  </head>
  <body
    class="bg-gray-50 flex justify-center min-h-screen text-gray-800 antialiased"
  >
    <!-- BEGIN: Mobile Container -->
    <main
      class="w-full max-w-md bg-white min-h-screen shadow-sm flex flex-col items-center pt-12 pb-10 px-6 sm:px-8"
    >
      <!-- BEGIN: Profile Section -->
      <header
        class="flex flex-col items-center w-full"
        data-purpose="profile-header"
      >
        <!-- Profile Avatar -->
        <div
          class="w-28 h-28 rounded-full border-2 border-transparent overflow-hidden mb-4 shadow-sm bg-[#FDD075] flex items-end justify-center relative"
        >
          <!-- Using FontAwesome for a placeholder icon similar to the avatar -->
          <i
            class="fa-solid fa-user-astronaut text-[#3A4561] text-6xl translate-y-2"
          ></i>
        </div>
        <!-- Profile Name -->
        <h1
          class="text-3xl font-bold tracking-tight text-gray-900 mb-3 flex items-baseline"
        >
          ziad<span class="text-teal-400 text-4xl leading-none">.</span>
        </h1>
        <!-- Profile Bio -->
        <p
          class="text-center text-[15px] font-medium text-gray-700 max-w-[280px] leading-relaxed mb-6"
        >
          A Software Engineer who loves coding, problem solving &amp; building.
        </p>
        <!-- Social Links -->
        <nav
          aria-label="Social Profiles"
          class="flex space-x-5 text-xl text-gray-800 mb-10"
        >
          <a
            aria-label="Twitter"
            class="hover:text-gray-600 transition-colors"
            href="#"
            ><i class="fa-brands fa-x-twitter"></i
          ></a>

          <a
            aria-label="GitHub"
            class="hover:text-gray-600 transition-colors"
            href="#"
            ><i class="fa-brands fa-github"></i
          ></a>
          <a
            aria-label="LinkedIn"
            class="hover:text-gray-600 transition-colors"
            href="#"
            ><i class="fa-brands fa-linkedin"></i
          ></a>
          <a
            aria-label="LinkedIn"
            class="hover:text-gray-600 transition-colors"
            href="#"
            ><i class="fa-solid fa-envelope"></i
          ></a>
        </nav>
      </header>
      <!-- END: Profile Section -->
      <!-- BEGIN: Featured Links Section -->
      <section
        class="w-full flex flex-col items-center"
        data-purpose="featured-links"
      >
        <!-- Section Title -->
        <h2
          class="text-xs font-semibold text-gray-400 tracking-widest uppercase mb-4"
        >
          Featured Links
        </h2>
        <!-- Links List -->
        <div class="w-full space-y-4">
          <!-- Link Item: My Website -->
          <a
            class="group block w-full bg-white border border-gray-300 rounded-[30px] p-2 pr-5 flex items-center justify-between hover:shadow-md transition-shadow"
            href="https://zyahya.dev"
          >
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-full bg-blue-400 flex items-center justify-center text-white text-lg"
              >
                <i class="fa-solid fa-globe"></i>
              </div>
              <span class="font-semibold text-gray-800">My Website</span>
            </div>
            <i
              class="fa-solid fa-arrow-right-long text-gray-500 group-hover:text-gray-800 transition-colors"
            ></i>
          </a>
          <!-- Link Item: Visual Ideas -->
          <a
            class="group block w-full bg-white border border-gray-300 rounded-[30px] p-2 pr-5 flex items-center justify-between hover:shadow-md transition-shadow"
            href="#"
          >
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-full bg-orange-400 flex items-center justify-center text-white text-lg"
              >
                <!-- <i class="fa-solid fa-pen-ruler"></i> -->
                <i class="fa-solid fa-box-open"></i>
              </div>
              <span class="font-semibold text-gray-800"
                >Kashida (+1.3K Downloads)</span
              >
            </div>
            <i
              class="fa-solid fa-arrow-right-long text-gray-500 group-hover:text-gray-800 transition-colors"
            ></i>
          </a>
          <!-- Link Item: Newsletter -->
          <a
            class="group block w-full bg-white border border-gray-300 rounded-[30px] p-2 pr-5 flex items-center justify-between hover:shadow-md transition-shadow"
            href="#"
          >
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-full bg-teal-400 flex items-center justify-center text-white text-lg"
              >
                <i class="fa-solid fa-envelope-open-text"></i>
              </div>
              <span class="font-semibold text-gray-800">Newsletter</span>
            </div>
            <i
              class="fa-solid fa-arrow-right-long text-gray-500 group-hover:text-gray-800 transition-colors"
            ></i>
          </a>
          <!-- Link Item: Shop -->
          <a
            class="group block w-full bg-white border border-gray-300 rounded-[30px] p-2 pr-5 flex items-center justify-between hover:shadow-md transition-shadow"
            href="#"
          >
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-full bg-purple-400 flex items-center justify-center text-white text-lg"
              >
                <i class="fa-solid fa-cart-shopping"></i>
              </div>
              <span class="font-semibold text-gray-800">Shop</span>
            </div>
            <i
              class="fa-solid fa-arrow-right-long text-gray-500 group-hover:text-gray-800 transition-colors"
            ></i>
          </a>
        </div>
      </section>
      <!-- END: Featured Links Section -->
    </main>
    <!-- END: Mobile Container -->
  </body>
</html>
